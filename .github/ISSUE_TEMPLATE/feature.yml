name: Feature request
description: Something WhatsOn should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        A login and a Seerr add mode were decided against, and Trakt is out of the interface for now.
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The problem first, then any idea for a solution
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV or app it involves, if any
      placeholder: "Roku, Fire TV, the Plex app"
