name: Release

# Push a tag vX.Y.Z that matches pyproject.toml, whatson/__init__.py and a "## X.Y.Z" section in CHANGELOG.md. This
# publishes ghcr.io/<owner>/<repo>:X.Y.Z, :X.Y and :latest for amd64 and arm64, runs them, and only then creates the
# GitHub release, with that version's changelog section as its notes.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag, version files and CHANGELOG.md agree
        run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}"

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Run what was just published on real hardware of each architecture.
  verify:
    needs: image
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions: {}
    steps:
      - run: |
          docker run -d --name whatson -p 8430:8430 "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            curl -fs http://localhost:8430/health && curl -fs -o /dev/null http://localhost:8430/static/js/main.js && exit 0
            sleep 2
          done
          docker logs whatson
          exit 1

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > release-notes.md
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "WhatsOn ${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag
